events {
    worker_connections 1024;
}

http {
    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Upstream definitions
    upstream librechat {
        server api:3080;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name airwall.local localhost;
        return 301 https://$server_name$request_uri;
    }

    # Main HTTPS server - LibreChat & Keycloak
    server {
        listen 443 ssl http2;
        server_name airwall.local localhost;

        ssl_certificate /etc/nginx/certs/librechat.crt;
        ssl_certificate_key /etc/nginx/certs/librechat.key;

        client_max_body_size 20M;

        # Keycloak authentication server
        location /keycloak/ {
            proxy_pass http://keycloak/keycloak/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_cache_bypass $http_upgrade;

            # Keycloak specific headers
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # LibreChat application (default)
        location / {
            proxy_pass http://librechat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}