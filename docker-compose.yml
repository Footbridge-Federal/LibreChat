# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - keycloak
    restart: unless-stopped
  api:
    container_name: Airwall
    depends_on:
      mongodb:
        condition: service_started
      keycloak:
        condition: service_started
      init-config:
        condition: service_completed_successfully
    build:
      context: .
      platforms:
        - linux/amd64
    image: airwallchat:latest
    platform: linux/amd64
    restart: always
    user: "1000:1000"
    environment:
      - HOST=0.0.0.0
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    extra_hosts:
      - "localhost:host-gateway"
      - "airwall.local:host-gateway"
    volumes:
      - ./config:/app/config
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./ssl:/app/ssl:ro
    env_file:
      - .env
      - .env.local
  mongodb:
    container_name: chat-mongodb
    image: mongo
    restart: always
    user: "1000:1000"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  keycloak:
    container_name: keycloak
    build:
      context: ./keycloak
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: airwallchat-keycloak:latest
    platform: linux/amd64
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak123
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/certs/keycloak.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/certs/keycloak.key
      - KC_HOSTNAME_URL=https://airwall.local/keycloak
      - KC_HOSTNAME_ADMIN_URL=https://airwall.local/keycloak
      - KC_HTTP_RELATIVE_PATH=/keycloak
      - KC_PROXY_HEADERS=xforwarded
    depends_on:
      - keycloak-db
    volumes:
      - ./ssl:/opt/keycloak/certs:ro
    command: start-dev
    restart: unless-stopped
  init-config:
    container_name: init-config
    build:
      context: .
      dockerfile: Dockerfile.init-config
      platforms:
        - linux/amd64
    image: airwallchat-init-config:latest
    platform: linux/amd64
    environment:
      # MongoDB connection
      - MONGO_URI=mongodb://mongodb:27017/Airwall
      # Keycloak connection (for sync scripts)
      - KEYCLOAK_SERVER_URL=http://keycloak:8080/keycloak
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KEYCLOAK_TARGET_REALM=AirwallChat
      # Keycloak connection (for keycloak-config-cli)
      - KEYCLOAK_URL=http://keycloak:8080/keycloak
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin123
      # AWS Secrets (disabled for local dev)
      - AWS_SECRETS_ENABLED=false
    env_file:
      - .env.local
    depends_on:
      mongodb:
        condition: service_started
      keycloak:
        condition: service_started
  keycloak-db:
    container_name: keycloak-db
    image: postgres:15
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata2:
  keycloak_db_data:
