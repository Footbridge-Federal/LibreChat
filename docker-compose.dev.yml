services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: LibreChat-API-dev
    ports:
      - "3080:3080"  # Backend API
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=${RAG_API_URL:-http://rag_api:8000}
    volumes:
      # Mount backend source
      - ./api:/app/api
      - ./packages:/app/packages
      - ./.env:/app/.env
      - ./librechat.yaml:/app/librechat.yaml
      # Persistent data
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
    command: ["npm", "run", "backend:dev"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: LibreChat-Frontend-dev
    ports:
      - "3090:3090"  # Frontend dev server
    depends_on:
      - api
    restart: always
    environment:
      - NODE_ENV=development
      - VITE_API_TARGET=http://api:3080  # Point to API container
    volumes:
      # Mount frontend source
      - ./client:/app/client
      - ./packages:/app/packages
      - ./.env:/app/.env
    command: ["npm", "run", "frontend:dev"]
  mongodb:
    container_name: chat-mongodb
    image: mongo
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.12:/meili_data
  vectordb:
    container_name: vectordb
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  pgdata2:
